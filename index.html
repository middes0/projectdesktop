<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090711">
<title>PROJECT DESKTOP</title>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:rgba(20,16,36,.88);--line:rgba(176,139,255,.22);--purple:#a879ff;--blue:#61d9ff;--muted:#9992b3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f0ff;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}#wallpaper{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 78% 18%,#352060 0,transparent 35%),radial-gradient(ellipse at 18% 82%,#102b50 0,transparent 37%),linear-gradient(135deg,#080710,#100b20 55%,#080711)}#wallpaper:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#desktop{position:fixed;inset:0 0 64px;padding:28px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:22px}.desk-icon{width:82px;border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:8px;padding:8px 4px;border-radius:12px}.desk-icon:hover,.desk-icon:focus-visible{background:#ffffff12;outline:1px solid #ffffff24}.app-glyph{width:48px;height:48px;display:grid;place-items:center;border:1px solid #c7a8ff55;border-radius:15px;background:linear-gradient(145deg,#38245d,#11152b);box-shadow:0 8px 26px #0005;color:#d9c6ff;font-size:22px}.desk-icon span:last-child{font-size:12px;text-shadow:0 2px 5px #000}
#topbar{position:fixed;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#08060dbb;border-bottom:1px solid #ffffff12;backdrop-filter:blur(20px);font-size:12px;color:#ddd5f4}#topbar strong{letter-spacing:2px;color:#d9c4ff}#status{display:flex;gap:14px;align-items:center}
#taskbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);height:52px;display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #c2a5ff30;border-radius:18px;background:#100c1bd9;box-shadow:0 12px 45px #0008;backdrop-filter:blur(24px);max-width:calc(100vw - 20px)}.taskbtn{width:40px;height:38px;border:1px solid transparent;border-radius:11px;background:transparent;font-size:19px}.taskbtn:hover,.taskbtn.active{background:#a879ff22;border-color:#a879ff55}.tasksep{width:1px;height:26px;background:#ffffff22;margin:0 2px}.clock{font-variant-numeric:tabular-nums;font-size:12px;color:#c9c0df;padding:0 7px;white-space:nowrap}
.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 24px));height:min(480px,calc(100dvh - 120px));min-height:230px;border:1px solid #c0a1ff55;border-radius:15px;overflow:hidden;background:#100d1cf2;box-shadow:0 25px 90px #000a;backdrop-filter:blur(28px);display:flex;flex-direction:column;animation:appear .16s ease-out}.window.minimized{display:none}.window.maximized{left:8px;top:42px;transform:none;width:calc(100vw - 16px);height:calc(100dvh - 116px)}@keyframes appear{from{opacity:0;scale:.98}to{opacity:1;scale:1}}.titlebar{height:43px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#ffffff08;border-bottom:1px solid #ffffff12;cursor:move;touch-action:none}.window-title{display:flex;align-items:center;gap:9px;font-weight:600}.win-controls{display:flex;gap:5px}.win-controls button{width:27px;height:26px;border:0;border-radius:7px;background:#ffffff0b}.win-controls button:hover{background:#a879ff33}.win-controls .close:hover{background:#ff557044}.window-content{padding:18px;overflow:auto;flex:1;color:#e6dff7}.muted{color:var(--muted)}.hero{padding:18px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(120deg,#a879ff13,#61d9ff08)}.hero h2{font-size:clamp(23px,4vw,34px);margin:4px 0 8px;letter-spacing:-1px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}.card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#ffffff06}.card b{display:block;font-size:20px;margin:5px 0}.action{border:1px solid #a879ff55;background:#a879ff1d;border-radius:9px;padding:9px 13px}.action:hover{background:#a879ff35}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#090711;color:white;outline:none}.field:focus{border-color:var(--purple)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:#ffffff07;border:1px solid #ffffff12;border-radius:9px}.note{font-size:12px;color:var(--muted)}.resize-handle{position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 45%,#a879ff88 46%,#a879ff88 53%,transparent 54%,transparent 65%,#a879ff88 66%,#a879ff88 73%,transparent 74%)}.calc-display{font:clamp(24px,5vw,36px)/1.3 ui-monospace,monospace;text-align:right;padding:18px 12px;background:#080610;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:72px;overflow-wrap:anywhere}.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.calc-key{min-height:48px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08;font-size:17px}.calc-key:hover{background:#a879ff25}.calc-key.operator{border-color:#a879ff44;color:#d6bcff;background:#a879ff14}.calc-key.equals{background:#8154d9;border-color:#a879ff;color:white}.calc-key.wide{grid-column:span 2}#toast{position:fixed;left:50%;top:48px;transform:translateX(-50%);padding:9px 14px;background:#201738;border:1px solid var(--line);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999}#toast.show{opacity:1}
@media(max-width:520px){#desktop{padding:48px 12px 12px;gap:10px}.desk-icon{width:72px}.app-glyph{width:43px;height:43px}.window{height:min(520px,calc(100dvh - 110px))}.window-content{padding:13px}#status .extra{display:none}.clock{font-size:11px}}
</style>
</head>
<body>
<div id="wallpaper"></div>
<header id="topbar"><strong>PROJECT <span style="color:#61d9ff">DESKTOP</span></strong><div id="status"><span class="extra">WORKSPACE 01</span><span>◈ ONLINE</span><span id="topclock">--:--</span></div></header>
<main id="desktop" aria-label="Área de trabalho">
<button class="desk-icon" data-app="files"><span class="app-glyph">▤</span><span>Arquivos</span></button>
<button class="desk-icon" data-app="notes"><span class="app-glyph">▧</span><span>Bloco de notas</span></button>
<button class="desk-icon" data-app="terminal"><span class="app-glyph">⌘</span><span>Terminal</span></button>\n<button class="desk-icon" data-app="calculator"><span class="app-glyph">＋</span><span>Calculadora</span></button>
<button class="desk-icon" data-app="settings"><span class="app-glyph">⚙</span><span>Configurações</span></button>
<button class="desk-icon" data-app="about"><span class="app-glyph">◈</span><span>Sobre</span></button>
</main>
<div id="windows"></div><div id="toast"></div>
<nav id="taskbar" aria-label="Barra de tarefas"><button class="taskbtn" title="Menu iniciar" data-app="start">◈</button><span class="tasksep"></span><button class="taskbtn" title="Arquivos" data-app="files">▤</button><button class="taskbtn" title="Bloco de notas" data-app="notes">▧</button><button class="taskbtn" title="Terminal" data-app="terminal">⌘</button><button class="taskbtn" title="Calculadora" data-app="calculator">＋</button><button class="taskbtn" title="Configurações" data-app="settings">⚙</button><span class="tasksep"></span><span class="clock" id="taskclock">--:--</span></nav>
<script>
const $=s=>document.querySelector(s), windows=$('#windows');let z=10, winCount=0;
const apps={
start:{title:'Menu iniciar',icon:'◈',html:()=>`<div class="hero"><div class="eyebrow">SYSTEM INTERFACE / 01</div><h2>Seu espaço digital.</h2><p class="muted">Um desktop experimental direto no navegador.</p></div><div class="cards">${[['▤','Arquivos','files'],['▧','Bloco de notas','notes'],['⌘','Terminal','terminal'],['＋','Calculadora','calculator'],['⚙','Configurações','settings']].map(a=>`<button class="card action" data-launch="${a[2]}" style="text-align:left"><span style="font-size:23px">${a[0]}</span><b style="font-size:14px">${a[1]}</b><span class="note">Abrir aplicativo</span></button>`).join('')}</div>`},
files:{title:'Arquivos',icon:'▤',html:()=>`<div class="eyebrow">EXPLORADOR</div><h2>Este dispositivo</h2><p class="muted">Pastas locais do ambiente de demonstração.</p><div class="list">${[['▰','Documentos','Seus rascunhos e textos'],['▣','Imagens','Área para imagens'],['▧','Downloads','Arquivos baixados']].map(a=>`<div class="list-item"><span>${a[0]} &nbsp; <b>${a[1]}</b><br><span class="note">${a[2]}</span></span><span class="muted">›</span></div>`).join('')}</div><p class="note">Esta versão não acessa arquivos privados do celular automaticamente.</p>`},
calculator:{title:'Calculadora',icon:'＋',html:()=>`<div class="eyebrow">CALCULADORA</div><div id="calc-display" class="calc-display" aria-live="polite">0</div><div class="calc-grid">${[['C','clear'],['±','sign'],['%','percent'],['÷','/'],['7','7'],['8','8'],['9','9'],['×','*'],['4','4'],['5','5'],['6','6'],['−','-'],['1','1'],['2','2'],['3','3'],['+','+'],['0','0','wide'],['.','.'],['=','=']].map(k=>`<button class="calc-key ${['/','*','-','+'].includes(k[1])?'operator':''} ${k[1]==='='?'equals':''} ${k[2]||''}" data-key="${k[1]}">${k[0]}</button>`).join('')}</div><p class="note">Operações básicas, porcentagem e sinal.</p>`},\nnotes:{title:'Bloco de notas',icon:'▧',html:()=>`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><div class="eyebrow">NOTAS LOCAIS</div><b>Rascunho</b></div><button class="action" id="save-note">Salvar</button></div><textarea class="field" id="note-text" style="height:calc(100% - 65px);resize:vertical" placeholder="Escreva alguma coisa..."></textarea><p class="note">O texto fica salvo neste navegador.</p>`},
terminal:{title:'Terminal',icon:'⌘',html:()=>`<div id="termout" style="font:13px/1.8 ui-monospace,monospace;color:#a8f0d2">PROJECT DESKTOP [versão 0.1]<br>Digite <b>help</b> para ver os comandos.<br><br></div><form id="termform" class="row"><span style="color:#a879ff">›</span><input id="terminput" class="field" autocomplete="off" placeholder="comando..." aria-label="Comando do terminal"></form>`},
settings:{title:'Configurações',icon:'⚙',html:()=>`<div class="eyebrow">PERSONALIZAÇÃO</div><h2>Configurações</h2><div class="list"><div class="list-item"><span><b>Brilho roxo</b><br><span class="note">Intensidade dos detalhes da interface</span></span><input id="accent" type="color" value="#a879ff" style="width:42px;height:34px;background:transparent;border:0"></div><div class="list-item"><span><b>Relógio de 24 horas</b><br><span class="note">Formato da barra superior</span></span><input id="clock24" type="checkbox" checked></div><div class="list-item"><span><b>Reduzir movimento</b><br><span class="note">Desativa animações da interface</span></span><input id="reduce-motion" type="checkbox"></div></div><p class="note">As preferências são aplicadas neste navegador.</p>`},
about:{title:'Sobre o projeto',icon:'◈',html:()=>`<div class="hero"><div class="eyebrow">BUILD 0.1 / PREVIEW</div><h2>PROJECT DESKTOP</h2><p>Um ambiente de trabalho virtual com janelas, aplicativos e visual futurista.</p></div><div class="cards"><div class="card"> <span class="muted">INTERFACE</span><b>Responsiva</b><span class="note">Celular e computador</span></div><div class="card"><span class="muted">APPS</span><b>5</b><span class="note">Aplicativos de demonstração</span></div></div><p class="note">É uma interface web; não substitui o sistema operacional e não executa programas instalados no dispositivo.</p>`}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function openApp(id){const app=apps[id];if(!app)return;const old=document.querySelector('[data-window="'+id+'"]');if(old){old.classList.remove('minimized');old.style.zIndex=++z;return}
const w=document.createElement('section');w.className='window';w.dataset.window=id;w.style.zIndex=++z;w.innerHTML=`<div class="titlebar"><div class="window-title"><span>${app.icon}</span>${app.title}</div><div class="win-controls"><button data-min title="Minimizar">—</button><button data-max title="Maximizar">□</button><button class="close" data-close title="Fechar">×</button></div></div><div class="window-content">${app.html()}</div><div class="resize-handle" title="Redimensionar janela"></div>`;windows.append(w);
w.addEventListener('pointerdown',()=>w.style.zIndex=++z);w.querySelector('[data-close]').onclick=()=>{w.remove();updateTasks()};w.querySelector('[data-min]').onclick=()=>{w.classList.add('minimized');updateTasks()};w.querySelector('[data-max]').onclick=()=>w.classList.toggle('maximized');makeDraggable(w);makeResizable(w);setupApp(id,w);updateTasks()}
function updateTasks(){document.querySelectorAll('.taskbtn[data-app]').forEach(b=>{const id=b.dataset.app;b.classList.toggle('active',!!document.querySelector('[data-window="'+id+'"]:not(.minimized)'))})}
function makeDraggable(w){const bar=w.querySelector('.titlebar');let start=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;start={x:e.clientX,y:e.clientY,left:w.offsetLeft,top:w.offsetTop};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;w.style.left=(start.left+dx+w.offsetWidth/2)+'px';w.style.top=(start.top+dy+w.offsetHeight/2)+'px';w.style.transform='translate(-50%,-50%)'});bar.addEventListener('pointerup',()=>start=null);bar.addEventListener('pointercancel',()=>start=null)}
function makeResizable(w){const h=w.querySelector('.resize-handle');let start=null;h.addEventListener('pointerdown',e=>{if(w.classList.contains('maximized'))return;e.preventDefault();start={x:e.clientX,y:e.clientY,width:w.offsetWidth,height:w.offsetHeight};h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!start)return;w.style.width=Math.max(280,Math.min(innerWidth-16,start.width+e.clientX-start.x))+'px';w.style.height=Math.max(230,Math.min(innerHeight-100,start.height+e.clientY-start.y))+'px'});h.addEventListener('pointerup',()=>start=null);h.addEventListener('pointercancel',()=>start=null)}\nfunction setupApp(id,w){if(id==='calculator'){let display=w.querySelector('#calc-display'),current='0',stored=null,op=null,reset=false;const render=()=>display.textContent=current;w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='clear'){current='0';stored=null;op=null;reset=false}else if(k==='sign'){current=String(Number(current)*-1)}else if(k==='percent'){current=String(Number(current)/100)}else if(['+','-','*','/'].includes(k)){stored=Number(current);op=k;reset=true}else if(k==='='){if(op&&stored!==null){const n=Number(current);let result=op==='+'?stored+n:op==='-'?stored-n:op==='*'?stored*n:stored/n;current=Number.isFinite(result)?String(Number(result.toPrecision(10))):'Erro';stored=null;op=null;reset=true}}else if(k==='.'){if(reset){current='0';reset=false}if(!current.includes('.'))current+='.'}else{if(reset||current==='0'||current==='Erro'){current=k;reset=false}else if(current.length<16)current+=k}render()})}if(id==='notes'){const area=w.querySelector('#note-text');area.value=localStorage.getItem('pd-note')||'';w.querySelector('#save-note').onclick=()=>{localStorage.setItem('pd-note',area.value);toast('Nota salva neste navegador')}}if(id==='terminal'){const form=w.querySelector('#termform'),input=w.querySelector('#terminput'),out=w.querySelector('#termout');form.onsubmit=e=>{e.preventDefault();const cmd=input.value.trim().toLowerCase();out.innerHTML+=`<span style="color:#d9c4ff">› ${escapeHtml(input.value)}</span><br>`;let result='Comando não encontrado. Digite help.';if(cmd==='help')result='help · date · clear · about · apps';else if(cmd==='date')result=new Date().toLocaleString('pt-BR');else if(cmd==='clear'){out.innerHTML='';input.value='';return}else if(cmd==='about')result='PROJECT DESKTOP — ambiente web experimental.';else if(cmd==='apps')result='Arquivos · Bloco de notas · Terminal · Configurações · Sobre';else if(!cmd)result='';out.innerHTML+=result+'<br><br>';input.value='';out.scrollTop=out.scrollHeight}}if(id==='settings'){const accent=w.querySelector('#accent'),clock=w.querySelector('#clock24'),motion=w.querySelector('#reduce-motion');accent.value=localStorage.getItem('pd-accent')||'#a879ff';clock.checked=localStorage.getItem('pd-clock24')!=='false';motion.checked=localStorage.getItem('pd-motion')==='true';document.documentElement.style.setProperty('--purple',accent.value);document.documentElement.style.setProperty('--motion',motion.checked?'0':'1');accent.oninput=e=>{document.documentElement.style.setProperty('--purple',e.target.value);localStorage.setItem('pd-accent',e.target.value)};clock.onchange=e=>{localStorage.setItem('pd-clock24',String(e.target.checked));updateClock(e.target.checked)};motion.onchange=e=>{localStorage.setItem('pd-motion',String(e.target.checked));document.documentElement.style.setProperty('--motion',e.target.checked?'0':'1')}}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-app],[data-launch]');if(!b)return;openApp(b.dataset.app||b.dataset.launch)});function updateClock(use24=true){const now=new Date();const opts={hour:'2-digit',minute:'2-digit',hour12:!use24};$('#topclock').textContent=now.toLocaleTimeString('pt-BR',opts);$('#taskclock').textContent=now.toLocaleTimeString('pt-BR',opts)}updateClock();setInterval(()=>updateClock(document.querySelector('#clock24')?.checked??true),15000);
</script>
</body>
</html>
