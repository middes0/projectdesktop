:root{--line:rgba(190,157,255,.24);--purple:#b18aff;--blue:#65e3ff;--muted:#aaa4c2}
body{background:#07060d;letter-spacing:.1px}

#taskbar{bottom:14px;height:60px;gap:8px;padding:8px 12px;border-radius:20px;border-color:#d3b8ff35;background:linear-gradient(145deg,#171124eF,#0c0b17eF);box-shadow:0 16px 55px #0009,inset 0 1px #ffffff12;max-width:calc(100vw - 18px)}
.taskbtn{width:42px;height:42px;border-radius:13px;font-size:19px;transition:background .16s,transform .16s}

<body>
<div id="wallpaper"></div>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-start" viewBox="0 0 24 24"><path fill="currentColor" d="M2 3.4 10.6 2v8.6H2V3.4Zm10.2-1.6L22 0v10.6H12.2V1.8ZM2 12.1h8.6v8.6L2 19.3v-7.2Zm10.2 0H22V24l-9.8-1.4V12.1Z"/></symbol>
<symbol id="i-files" viewBox="0 0 48 48"><path fill="#f6c453" d="M5 11a4 4 0 0 1 4-4h11l5 5h14a4 4 0 0 1 4 4v21a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V11Z"/><path fill="#ffe08a" d="M5 18h38v19a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V18Z"/><path fill="#fff0b8" d="M8 20h32v15a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V20Z"/></symbol>
<symbol id="i-notes" viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="38" rx="5" fill="#2d7edb"/><path d="M15 15h18M15 21h18M15 27h14M15 33h11" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M9 12H6v25a4 4 0 0 0 4 4h21v-3H12a3 3 0 0 1-3-3V12Z" fill="#77bdff"/></symbol>
<symbol id="i-terminal" viewBox="0 0 48 48"><rect x="4" y="7" width="40" height="34" rx="6" fill="#253448"/><path d="m12 18 7 6-7 6M23 31h12" fill="none" stroke="#e8f5ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="12" r="1" fill="#72d6a0"/></symbol>
<symbol id="i-calculator" viewBox="0 0 48 48"><rect x="8" y="4" width="32" height="40" rx="5" fill="#f7f9fc" stroke="#7f9db9" stroke-width="1.5"/><rect x="12" y="8" width="24" height="9" rx="2" fill="#dbeaf8"/><g fill="#4d8dcb"><rect x="12" y="21" width="5" height="5" rx="1"/><rect x="21" y="21" width="5" height="5" rx="1"/><rect x="30" y="21" width="6" height="5" rx="1"/><rect x="12" y="29" width="5" height="5" rx="1"/><rect x="21" y="29" width="5" height="5" rx="1"/><rect x="30" y="29" width="6" height="5" rx="1"/><rect x="12" y="37" width="14" height="3" rx="1"/><rect x="30" y="37" width="6" height="3" rx="1"/></g></symbol>
<symbol id="i-settings" viewBox="0 0 48 48"><path fill="#91a3b8" d="m20 4 8 0 1.4 5.1a16 16 0 0 1 3.2 1.3l4.7-2.4 5.6 5.6-2.4 4.7a16 16 0 0 1 1.3 3.2L47 23v8l-5.2 1.4a16 16 0 0 1-1.3 3.2l2.4 4.7-5.6 5.6-4.7-2.4a16 16 0 0 1-3.2 1.3L28 50h-8l-1.4-5.2a16 16 0 0 1-3.2-1.3l-4.7 2.4-5.6-5.6 2.4-4.7a16 16 0 0 1-1.3-3.2L1 31v-8l5.2-1.4a16 16 0 0 1 1.3-3.2l-2.4-4.7 5.6-5.6 4.7 2.4a16 16 0 0 1 3.2-1.3L20 4Z" transform="translate(1 -1) scale(.96)"/><circle cx="24" cy="24" r="9" fill="#eaf1f8"/><circle cx="24" cy="24" r="4" fill="#7f92a8"/></symbol>
<symbol id="i-about" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#3789db"/><circle cx="24" cy="15" r="2.5" fill="#fff"/><path d="M24 22v12" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
</svg>
<header id="topbar"><strong>PROJECT <span style="color:#61d9ff">DESKTOP</span></strong><div id="status"><span class="extra">WORKSPACE 01</span><span>◈ ONLINE</span><span id="topclock">--:--</span></div></header>
<main id="desktop" aria-label="Área de trabalho">
<button class="desk-icon" data-app="files"><span class="app-glyph">▤</span><span>Arquivos</span></button>
<button class="desk-icon" data-app="notes"><span class="app-glyph">▧</span><span>Bloco de notas</span></button>
<button class="desk-icon" data-app="terminal"><span class="app-glyph">⌘</span><span>Terminal</span></button>
<button class="desk-icon" data-app="calculator"><span class="app-glyph">＋</span><span>Calculadora</span></button>
<button class="desk-icon" data-app="settings"><span class="app-glyph">⚙</span><span>Configurações</span></button>
<button class="desk-icon" data-app="about"><span class="app-glyph">ⓘ</span><span>Sobre</span></button>
</main>
<div id="windows"></div><div id="toast"></div>
<nav id="taskbar" aria-label="Barra de tarefas"><button class="taskbtn" title="Menu iniciar" data-app="start">⊞</button><span class="tasksep"></span><button class="taskbtn" title="Arquivos" data-app="files">▤</button><button class="taskbtn" title="Bloco de notas" data-app="notes">▧</button><button class="taskbtn" title="Terminal" data-app="terminal">⌘</button><button class="taskbtn" title="Calculadora" data-app="calculator">＋</button><button class="taskbtn" title="Configurações" data-app="settings">⚙</button><span class="tasksep"></span><span class="clock" id="taskclock">--:--</span></nav>
<script>
const $=s=>document.querySelector(s), windows=$('#windows');let z=10, winCount=0;

const iconSvg=(name)=>'<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#i-'+name+'"></use></svg>';
const iconName={start:'start',files:'files',notes:'notes',terminal:'terminal',calculator:'calculator',settings:'settings',about:'about'};
document.querySelectorAll('.desk-icon[data-app]').forEach(b=>{const n=iconName[b.dataset.app];if(n)b.querySelector('.app-glyph').innerHTML=iconSvg(n)});
document.querySelectorAll('#taskbar .taskbtn[data-app]').forEach(b=>{const n=iconName[b.dataset.app];if(n)b.innerHTML=iconSvg(n)});

const apps={
start:{title:'Menu iniciar',icon:iconSvg('start'),html:()=>`<div class="hero"><div class="eyebrow">SYSTEM INTERFACE / 01</div><h2>Seu espaço digital.</h2><p class="muted">Um desktop experimental direto no navegador.</p></div><div class="cards">${[['files','Arquivos','files'],['notes','Bloco de notas','notes'],['terminal','Terminal','terminal'],['calculator','Calculadora','calculator'],['settings','Configurações','settings']].map(a=>`<button class="card action" data-launch="${a[2]}" style="text-align:left"><span class="launch-icon">${iconSvg(a[0])}</span><b style="font-size:14px">${a[1]}</b><span class="note">Abrir aplicativo</span></button>`).join('')}</div>`},
files:{title:'Arquivos',icon:iconSvg('files'),html:()=>`<div class="eyebrow">EXPLORADOR</div><h2>Este dispositivo</h2><p class="muted">Pastas locais do ambiente de demonstração.</p><div class="list">${[['▰','Documentos','Seus rascunhos e textos'],['▣','Imagens','Área para imagens'],['▧','Downloads','Arquivos baixados']].map(a=>`<div class="list-item"><span>${a[0]} &nbsp; <b>${a[1]}</b><br><span class="note">${a[2]}</span></span><span class="muted">›</span></div>`).join('')}</div><p class="note">Esta versão não acessa arquivos privados do celular automaticamente.</p>`},
calculator:{title:'Calculadora',icon:iconSvg('calculator'),html:()=>`<div class="eyebrow">CALCULADORA</div><div id="calc-display" class="calc-display" aria-live="polite">0</div><div class="calc-grid">${[['C','clear'],['±','sign'],['%','percent'],['÷','/'],['7','7'],['8','8'],['9','9'],['×','*'],['4','4'],['5','5'],['6','6'],['−','-'],['1','1'],['2','2'],['3','3'],['+','+'],['0','0','wide'],['.','.'],['=','=']].map(k=>`<button class="calc-key ${['/','*','-','+'].includes(k[1])?'operator':''} ${k[1]==='='?'equals':''} ${k[2]||''}" data-key="${k[1]}">${k[0]}</button>`).join('')}</div><p class="note">Operações básicas, porcentagem e sinal.</p>`},
notes:{title:'Bloco de notas',icon:iconSvg('notes'),html:()=>`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><div class="eyebrow">NOTAS LOCAIS</div><b>Rascunho</b></div><button class="action" id="save-note">Salvar</button></div><textarea class="field" id="note-text" style="height:calc(100% - 65px);resize:vertical" placeholder="Escreva alguma coisa..."></textarea><p class="note">O texto fica salvo neste navegador.</p>`},
terminal:{title:'Terminal',icon:iconSvg('terminal'),html:()=>`<div id="termout" style="font:13px/1.8 ui-monospace,monospace;color:#a8f0d2">PROJECT DESKTOP [versão 0.1]<br>Digite <b>help</b> para ver os comandos.<br><br></div><form id="termform" class="row"><span style="color:#a879ff">›</span><input id="terminput" class="field" autocomplete="off" placeholder="comando..." aria-label="Comando do terminal"></form>`},
settings:{title:'Configurações',icon:iconSvg('settings'),html:()=>`<div class="eyebrow">PERSONALIZAÇÃO</div><h2>Configurações</h2><div class="list"><div class="list-item"><span><b>Brilho roxo</b><br><span class="note">Intensidade dos detalhes da interface</span></span><input id="accent" type="color" value="#a879ff" style="width:42px;height:34px;background:transparent;border:0"></div><div class="list-item"><span><b>Relógio de 24 horas</b><br><span class="note">Formato da barra superior</span></span><input id="clock24" type="checkbox" checked></div><div class="list-item"><span><b>Reduzir movimento</b><br><span class="note">Desativa animações da interface</span></span><input id="reduce-motion" type="checkbox"></div></div><p class="note">As preferências são aplicadas neste navegador.</p>`},
about:{title:'Sobre o projeto',icon:iconSvg('about'),html:()=>`<div class="hero"><div class="eyebrow">BUILD 0.1 / PREVIEW</div><h2>PROJECT DESKTOP</h2><p>Um ambiente de trabalho virtual com janelas, aplicativos e visual futurista.</p></div><div class="cards"><div class="card"> <span class="muted">INTERFACE</span><b>Responsiva</b><span class="note">Celular e computador</span></div><div class="card"><span class="muted">APPS</span><b>5</b><span class="note">Aplicativos de demonstração</span></div></div><p class="note">É uma interface web; não substitui o sistema operacional e não executa programas instalados no dispositivo.</p>`}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function openApp(id){const app=apps[id];if(!app)return;const old=document.querySelector('[data-window="'+id+'"]');if(old){old.classList.remove('minimized');old.style.zIndex=++z;return}
const w=document.createElement('section');w.className='window';w.dataset.window=id;w.style.zIndex=++z;w.innerHTML=`<div class="titlebar"><div class="window-title"><span class="app-icon">${app.icon}</span>${app.title}</div><div class="win-controls"><button data-min title="Minimizar">—</button><button data-max title="Maximizar">□</button><button class="close" data-close title="Fechar">×</button></div></div><div class="window-content">${app.html()}</div><div class="resize-handle" title="Redimensionar janela"></div>`;windows.append(w);
w.addEventListener('pointerdown',()=>w.style.zIndex=++z);w.querySelector('[data-close]').onclick=()=>{w.remove();updateTasks()};w.querySelector('[data-min]').onclick=()=>{w.classList.add('minimized');updateTasks()};w.querySelector('[data-max]').onclick=()=>w.classList.toggle('maximized');makeDraggable(w);makeResizable(w);setupApp(id,w);updateTasks()}
function updateTasks(){document.querySelectorAll('.taskbtn[data-app]').forEach(b=>{const id=b.dataset.app;b.classList.toggle('active',!!document.querySelector('[data-window="'+id+'"]:not(.minimized)'))})}
function makeDraggable(w){const bar=w.querySelector('.titlebar');let start=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;const r=w.getBoundingClientRect();start={x:e.clientX,y:e.clientY,left:r.left,top:r.top};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;w.style.left=(start.left+dx)+'px';w.style.top=(start.top+dy)+'px';w.style.transform='none'});bar.addEventListener('pointerup',()=>start=null);bar.addEventListener('pointercancel',()=>start=null)}
function makeResizable(w){const h=w.querySelector('.resize-handle');let start=null;h.addEventListener('pointerdown',e=>{if(w.classList.contains('maximized'))return;e.preventDefault();start={x:e.clientX,y:e.clientY,width:w.offsetWidth,height:w.offsetHeight};h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!start)return;w.style.width=Math.max(280,Math.min(innerWidth-16,start.width+e.clientX-start.x))+'px';w.style.height=Math.max(230,Math.min(innerHeight-100,start.height+e.clientY-start.y))+'px'});h.addEventListener('pointerup',()=>start=null);h.addEventListener('pointercancel',()=>start=null)}

function renderStartMenu(w){
const content=w.querySelector('.window-content');
const items=[['files','Arquivos'],['notes','Bloco de notas'],['terminal','Terminal'],['calculator','Calculadora'],['settings','Configurações'],['about','Sobre']];
let html='<div class="start-search"><span>⌕</span><input class="field" id="start-search" placeholder="Pesquisar aplicativos" aria-label="Pesquisar aplicativos"></div>';
html+='<div class="start-heading"><b>Fixados</b><span>Todos os aplicativos ›</span></div><div class="start-pins">';
items.forEach(function(item){html+='<button class="start-pin" data-launch="'+item[0]+'"><span class="launch-icon">'+iconSvg(item[0])+'</span><span>'+item[1]+'</span></button>'});
html+='</div><div class="start-heading start-recommended"><b>Recomendados</b><span>Recentes</span></div><div class="start-recent"><span class="recent-mark">◷</span><span><b>Bloco de notas</b><small>Continue suas notas salvas</small></span><button class="action" data-launch="notes">Abrir</button></div><div class="start-footer"><span class="profile-dot">P</span><b>Usuário</b><span class="start-build">PROJECT DESKTOP</span></div>';
content.innerHTML=html;
const input=content.querySelector('#start-search');
input.addEventListener('input',function(){const q=input.value.toLocaleLowerCase('pt-BR').trim();content.querySelectorAll('.start-pin').forEach(function(b){b.hidden=!b.textContent.toLocaleLowerCase('pt-BR').includes(q)});const recent=content.querySelector('.start-recent');recent.hidden=!!q&&!recent.textContent.toLocaleLowerCase('pt-BR').includes(q)});
}

function setupApp(id,w){if(id==='start')renderStartMenu(w);if(id==='calculator'){let display=w.querySelector('#calc-display'),current='0',stored=null,op=null,reset=false;const render=()=>display.textContent=current;w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='clear'){current='0';stored=null;op=null;reset=false}else if(k==='sign'){current=String(Number(current)*-1)}else if(k==='percent'){current=String(Number(current)/100)}else if(['+','-','*','/'].includes(k)){stored=Number(current);op=k;reset=true}else if(k==='='){if(op&&stored!==null){const n=Number(current);let result=op==='+'?stored+n:op==='-'?stored-n:op==='*'?stored*n:stored/n;current=Number.isFinite(result)?String(Number(result.toPrecision(10))):'Erro';stored=null;op=null;reset=true}}else if(k==='.'){if(reset){current='0';reset=false}if(!current.includes('.'))current+='.'}else{if(reset||current==='0'||current==='Erro'){current=k;reset=false}else if(current.length<16)current+=k}render()})}if(id==='notes'){const area=w.querySelector('#note-text');area.value=localStorage.getItem('pd-note')||'';w.querySelector('#save-note').onclick=()=>{localStorage.setItem('pd-note',area.value);toast('Nota salva neste navegador')}}if(id==='terminal'){const form=w.querySelector('#termform'),input=w.querySelector('#terminput'),out=w.querySelector('#termout');form.onsubmit=e=>{e.preventDefault();const cmd=input.value.trim().toLowerCase();out.innerHTML+=`<span style="color:#d9c4ff">› ${escapeHtml(input.value)}</span><br>`;let result='Comando não encontrado. Digite help.';if(cmd==='help')result='help · date · clear · about · apps';else if(cmd==='date')result=new Date().toLocaleString('pt-BR');else if(cmd==='clear'){out.innerHTML='';input.value='';return}else if(cmd==='about')result='PROJECT DESKTOP — ambiente web experimental.';else if(cmd==='apps')result='Arquivos · Bloco de notas · Terminal · Configurações · Sobre';else if(!cmd)result='';out.innerHTML+=result+'<br><br>';input.value='';out.scrollTop=out.scrollHeight}}if(id==='settings'){const accent=w.querySelector('#accent'),clock=w.querySelector('#clock24'),motion=w.querySelector('#reduce-motion');accent.value=localStorage.getItem('pd-accent')||'#a879ff';clock.checked=localStorage.getItem('pd-clock24')!=='false';motion.checked=localStorage.getItem('pd-motion')==='true';document.documentElement.style.setProperty('--purple',accent.value);document.documentElement.style.setProperty('--motion',motion.checked?'0':'1');accent.oninput=e=>{document.documentElement.style.setProperty('--purple',e.target.value);localStorage.setItem('pd-accent',e.target.value)};clock.onchange=e=>{localStorage.setItem('pd-clock24',String(e.target.checked));updateClock(e.target.checked)};motion.onchange=e=>{localStorage.setItem('pd-motion',String(e.target.checked));document.documentElement.style.setProperty('--motion',e.target.checked?'0':'1')}}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-app],[data-launch]');if(!b)return;openApp(b.dataset.app||b.dataset.launch)});function updateClock(use24=true){const now=new Date();const opts={hour:'2-digit',minute:'2-digit',hour12:!use24};$('#topclock').textContent=now.toLocaleTimeString('pt-BR',opts);$('#taskclock').textContent=now.toLocaleTimeString('pt-BR',opts)}updateClock();setInterval(()=>updateClock(document.querySelector('#clock24')?.checked??true),15000);
</script>
</body>
</html>
